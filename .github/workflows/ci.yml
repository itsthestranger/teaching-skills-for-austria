# Continuous integration for teaching-skills-austria.
#
# Five independent gates, one job each, so a red build names the rule it broke rather than
# "CI failed":
#
#   dataset          schema validation of the six shipped shards -- hard rules fail the run,
#                    soft rules are reported and do not (the project carries one accepted soft
#                    finding, the SEK1.M zahlen.json size overage, which must never fail a build)
#   tests            repository-wide pytest: parser unit tests over the committed fixtures AND
#                    the DOCX golden-file tests, which only run if collection covers the whole
#                    repo -- see the collection guard in that job
#   fetcher-selftest the fetcher's offline correctness checks, run with the network blackholed
#   plugin-manifest  the plugin manifests still parse and carry no unresolved release placeholder
#   plugin-smoke     the installed-plugin path on a genuinely fresh environment (E10-06)
#
# Every job except `plugin-smoke` runs without network access and without
# `data-pipeline/resources/`, which is gitignored: the live-source tests skip themselves when it
# is absent (~63 skips on a clean checkout) and that is the expected CI shape, not a failure.
# `plugin-smoke` is the deliberate exception -- proving python-docx installs on a fresh machine
# is the one thing that cannot be done without fetching it. See that job for the boundary.
#
# There is deliberately NO amendment-detection job. `detect_amendment.py` diffs a candidate
# manifest against the committed one, and CI only ever has the committed one -- any such job
# would compare a file with itself and could only ever pass. That is the vacuous-check failure
# mode the `tests` collection guard exists to prevent, so it is not reproduced here. Amendment
# detection is manual and on-notice (plan section 10.3): re-run the fetcher, then diff the fresh
# manifest against the committed baseline before updating it.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The DOCX goldens are byte-maps of python-docx output. Pin the interpreter so a runner
  # image bump cannot turn a packaging difference into a phantom golden failure; raise this
  # deliberately, with the goldens re-verified locally on the new version first.
  PYTHON_VERSION: "3.13"

jobs:
  dataset:
    name: Schema validation (hard fails, soft reports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt

      # Exit 1 on any hard finding; soft findings print and pass. `--strict` would promote
      # soft findings too and is deliberately NOT used: it would fail every build on the
      # accepted zahlen.json overage.
      - name: Validate the six shards
        run: python data-pipeline/validate_dataset.py

      # Independent of the pipeline that produced the data: locates every shipped competence
      # and descriptor string in the RIS XML itself. Runs against the committed fixtures, so it
      # needs no network and no gitignored resources.
      - name: Source-truth fidelity
        run: python data-pipeline/verify_source_fidelity.py

      - name: Machine-readable report
        if: always()
        run: python data-pipeline/validate_dataset.py --json > validate_dataset.json || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: validate-dataset-report
          path: validate_dataset.json
          if-no-files-found: warn

  tests:
    name: Tests (parser fixtures + DOCX goldens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt

      # The golden tests live in tests/ while the parser tests live in data-pipeline/tests/.
      # A future pytest config that narrowed collection to one of those roots would leave this
      # job green while silently testing half the repository -- exactly the vacuous-check
      # failure mode this project keeps hitting. Assert both suites are actually collected
      # before running anything.
      - name: Guard -- both suites are in the collected set
        run: |
          python - <<'PY'
          import subprocess, sys
          out = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q"],
              capture_output=True, text=True, check=False,
          ).stdout
          required = [
              "tests/test_renderer_golden.py",
              "tests/test_niveau_spalte_rendering.py",
              "data-pipeline/tests/test_parse_lehrplan.py",
              "data-pipeline/tests/test_shipped_bytes.py",
          ]
          missing = [path for path in required if path not in out]
          if missing:
              sys.exit("collection does not reach: " + ", ".join(missing))
          print("collection guard: all required suites present")
          PY

      # Repository-wide, so the renderer goldens are included: any DOCX package-member diff
      # fails here. python-docx is installed, so the golden tests must not skip.
      - name: pytest
        run: python -m pytest -q

  fetcher-selftest:
    name: Fetcher self-test (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt

      # Point every proxy variable at a closed port so an accidental outbound call fails fast
      # and loudly instead of quietly succeeding on the runner's live network. The self-test
      # is meant to prove offline correctness; it may never depend on reaching RIS.
      #
      # LOWERCASE ONLY -- do not add HTTP_PROXY/HTTPS_PROXY/NO_PROXY alongside these.
      # GitHub Actions compares `env:` keys case-insensitively and rejects the whole workflow
      # file with "'HTTP_PROXY' is already defined". Lowercase is sufficient: the fetcher uses
      # urllib only, and urllib.request.getproxies_environment() lower-cases every variable
      # name before matching, so it honours these. Guarded by tests/test_ci_workflow.py.
      - name: --self-test with the network blackholed
        env:
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: ""
        run: python data-pipeline/fetch_ris_resources.py --self-test

  plugin-manifest:
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Manifests parse as JSON
        run: |
          python - <<'PY'
          import json
          for path in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"):
              with open("plugin/" + path, encoding="utf-8") as handle:
                  json.load(handle)
              print("ok:", path)
          PY

      # `claude plugin validate --strict` is not available on the runner, so this is the
      # portable subset: the manifests parse, and the release placeholders are still tracked.
      # It reports rather than fails -- replacing them is E11-01, and the build must not go
      # red for a known, scheduled release task.
      - name: Report unresolved release placeholders
        run: |
          if grep -rn 'TODO-KONTAKT-EMAIL\|<Name/Org>' plugin/ data-pipeline/ ; then
            echo "::warning::release placeholders are still present (E11-01)"
          else
            echo "no release placeholders left"
          fi

  plugin-smoke:
    name: Plugin smoke test (fresh environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # This is the Node the Claude Code CLI runs on, which is a separate thing from the Node
      # runtime the actions themselves use. Kept on an active LTS deliberately: this job is the
      # closest thing the project has to a real user's fresh environment (E10-06/E11-06), so
      # pinning it to an end-of-life Node would make the smoke test prove something no user
      # experiences. Node 20 went EOL in April 2026; 24 is the current LTS.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # The Claude Code CLI, not python-docx, is this job's own subject: `plugin validate
      # --strict`, `marketplace add` and `install` need the real CLI. Installed fresh every run
      # so a break in the install step fails the job loudly rather than letting the smoke test
      # downgrade to its PROXY-SKIPPED path and report success for steps it never ran.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # This job is the one place network access is allowed, and only for the wheel build:
      # decision E5-11 kept upstream's runtime `pip install`, so the delivery story this job
      # exists to verify is precisely "the dependency can be fetched and installed on a machine
      # that does not have it". The install into the fresh venv is itself done --no-index with
      # the proxies blackholed, so only the wheel build reaches the network.
      #
      # --require-cli turns a missing or broken `claude` binary into a hard failure instead of a
      # silent skip; without it this job could pass while testing none of the CLI chain.
      - name: Plugin smoke test
        run: python scripts/plugin_smoke_test.py --require-cli --json > smoke_report.json

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: plugin-smoke-test-report
          path: smoke_report.json
          if-no-files-found: warn
